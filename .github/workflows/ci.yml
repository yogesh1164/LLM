name: V2 verification

on:
  pull_request:
  push:
    branches: [main, feature/v2-production-hardening]
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: development
      DATABASE_URL: sqlite://
      GEMINI_API_KEY: offline-ci-placeholder
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --constraint backend/constraints.txt -e './backend[dev,openai]'
      - run: python -m pytest backend/tests -q -p no:cacheprovider
      - run: python -m ruff check backend
      - run: python -m pip check

  durable-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: development
      DATABASE_URL: sqlite://
      GEMINI_API_KEY: offline-ci-placeholder
      DURABLE_TEST_DATABASE_URL: postgresql+psycopg://durable_fixture:offline-fixture-only@127.0.0.1:5432/agentflow_durable_fixture
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: agentflow_durable_fixture
          POSTGRES_USER: durable_fixture
          POSTGRES_PASSWORD: offline-fixture-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U durable_fixture -d agentflow_durable_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --constraint constraints.txt -e '.[dev,openai]'
      - run: python -m pytest tests/test_durable_postgres.py tests/test_accounts_postgres.py -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: ''
      NEXT_OUTPUT_STANDALONE: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run check:encoding
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: python -m pip install --constraint backend/constraints.txt -e './backend[dev,openai]' pip-audit
      - run: python -m pip_audit --skip-editable
      - run: npm audit --audit-level=low
        working-directory: frontend

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full history without exposing matches
        run: docker run --rm --network none -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 git /repo --redact --no-banner

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Lint Dockerfile
        run: docker run --rm -i --network none hadolint/hadolint:v2.12.0-alpine@sha256:3c206a451cec6d486367e758645269fd7d696c5ccb6ff59d8b03b0e45268a199 hadolint --failure-threshold error - < "${{ matrix.service }}/Dockerfile"
      - name: Build production image without credentials or publishing
        run: docker build --tag "agentflow-${{ matrix.service }}:ci" "${{ matrix.service }}"
      - uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6.5.1
        with:
          image: agentflow-${{ matrix.service }}:ci
          fail-build: true
          severity-cutoff: high
          output-format: table

  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate only with disposable CI placeholders
        env:
          API_ACCESS_TOKEN: offline-ci-placeholder-at-least-32-characters
          GEMINI_API_KEY: offline-ci-placeholder
          POSTGRES_PASSWORD: offline-ci-placeholder
          FRONTEND_ORIGINS: https://localhost:8443
          SITE_HOST: localhost
        run: |
          test ! -e .env.production
          touch .env.production
          docker compose -p agentflow-ci -f compose.production.yml --env-file .env.production config --quiet
          docker compose -p agentflow-ci -f compose.production.yml -f deploy/compose.limits.yml --env-file .env.production config --quiet
      - name: Validate workflow syntax
        run: docker run --rm --network none -v "$PWD/.github/workflows:/workflows:ro" rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 -color /workflows/ci.yml
